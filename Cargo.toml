[package]
name = "ZagCam"
version = "0.1.0"
edition = "2024"

[features]
default = []
sink-vcam = ["dep:virtualcam"]

[dependencies]
minifb = "0.29"
nokhwa = { version = "0.10", default-features = false, features = ["input-msmf", "decoding"] }
ort = "2.0.0-rc.15"
fast_image_resize = { version = "6", features = ["rayon"] }
rayon = "1"
virtualcam = { version = "0.1.1", optional = true, default-features = false, features = ["obs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
