[package]
name = "ZagCam"
version = "0.1.0"
edition = "2024"

[dependencies]
minifb = "0.29"
nokhwa = { version = "0.10", default-features = false, features = ["input-msmf", "decoding"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
