[package]
name = "ZagCam"
version = "0.5.0-beta.1"
edition = "2024"

[workspace]
resolver = "2"
members = [".", "crates/zagcam-vcam-shared", "crates/zagcam-vcam", "crates/zagcam-vcam-mgr"]

[features]
default = []
sink-vcam = ["dep:virtualcam"]

[dependencies]
minifb = "0.29"
nokhwa = { version = "0.10", default-features = false, features = ["input-msmf", "decoding"] }
# No copy-dylibs: the Windows prebuilt is the DirectML build, but this app only uses the CPU EP,
# so the 17.7 MiB DirectML.dll is not needed at runtime or in the package.
ort = { version = "2.0.0-rc.15", default-features = false, features = [
    "std",
    "ndarray",
    "tracing",
    "download-binaries",
    "tls-native",
] }
fast_image_resize = { version = "6", features = ["rayon"] }
rayon = "1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "rayon"] }
serde_json = "1"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
# No comctl32 v6 features: TaskDialogIndirect needs an app manifest, or the exe fails to load.
tray-icon = { version = "0.26", default-features = false }
rfd = { version = "0.18", default-features = false }
virtualcam = { version = "0.1.1", optional = true, default-features = false, features = ["obs"] }
zagcam-vcam-mgr = { path = "crates/zagcam-vcam-mgr" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# `panic = "abort"` is intentionally not set: the camera provider runs inside the Windows Frame
# Server service and must unwind into the COM method's Result instead of killing the service.
