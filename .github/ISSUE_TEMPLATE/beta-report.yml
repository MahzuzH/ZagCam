name: Beta report
description: Report a ZagCam beta install, compatibility, or call issue
title: "[beta] "
labels: ["beta"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach video frames, meeting recordings, or credentials. Run `collect-logs.ps1`
        and attach the text file. See `beta/FEEDBACK.md`.
  - type: input
    id: version
    attributes:
      label: ZagCam version
      description: Output of `ZagCam.exe --version`
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and build
      description: Output of `winver`
    validations:
      required: true
  - type: input
    id: camera
    attributes:
      label: Camera
      description: Built-in or USB model
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Meeting app and version
      description: Meet/Chrome, Teams, Discord, Zoom, OBS, etc.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Support file contents or attachment
      description: `collect-logs.ps1` output, provider log tail, or `vcam status`
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not include video, meeting recordings, or credentials.
          required: true
